services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MONGODB_URI: mongodb://mongo:27017/online-compiler
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-86400}
      SANDBOX_IMAGE: online-compiler-sandbox:gcc14
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
      SANDBOX_MAX_CONCURRENCY: ${SANDBOX_MAX_CONCURRENCY:-4}
      SANDBOX_MAX_QUEUE: ${SANDBOX_MAX_QUEUE:-32}
    group_add:
      - "${DOCKER_GID:?DOCKER_GID must be set to the group id of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongo:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped

  sandbox-image:
    build: ./sandbox
    image: online-compiler-sandbox:gcc14
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo-data:
